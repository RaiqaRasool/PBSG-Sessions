<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="920" viewBox="0 0 1100 920" role="img" aria-labelledby="title desc"><title id="title">Choose your portfolio personality</title><desc id="desc">Four schematic style cards: Field Notes, The Magazine, Color Studio, and Retro Desktop. These show possible typography, color, and composition, not finished portfolios.</desc><rect width="1100" height="920" fill="#E9E8E4"/><text x="50" y="58" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#202020">One résumé. Four personalities.</text><text x="50" y="88" font-family="Arial,sans-serif" font-size="17" fill="#444">Pick a number. All styles adapt to your work. These are schematic previews.</text><g transform="translate(50,120)"><rect width="480" height="345" rx="12" fill="#F6F1E7"/><text x="24" y="35" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#A64C38">01 / Field Notes</text><path d="M140 63V310 M24 224H452" stroke="#17324D" opacity=".2"/><text x="24" y="91" fill="#A64C38" font-family="monospace" font-size="12">A FEW</text><text x="24" y="109" fill="#A64C38" font-family="monospace" font-size="12">FIELD NOTES</text><text x="163" y="105" font-family="Georgia,serif" font-size="32" fill="#17324D">Work worth</text><text x="163" y="145" font-family="Georgia,serif" font-size="32" fill="#17324D">exploring.</text><text x="163" y="182" font-family="Arial,sans-serif" font-size="14" fill="#17324D">A little context. A clear introduction.</text><text x="24" y="258" font-family="monospace" font-size="13" fill="#A64C38">01</text><text x="74" y="258" font-family="Georgia,serif" font-size="21" fill="#17324D">Selected work and discoveries</text></g><g transform="translate(570,120)"><rect width="480" height="345" rx="12" fill="#FFFAF0"/><text x="24" y="35" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#A9252B">02 / The Magazine</text><path d="M24 55H456 M24 209H456" stroke="#202020"/><text x="24" y="110" font-family="Georgia,serif" font-size="38" font-weight="bold" fill="#202020">Ideas with</text><text x="24" y="156" font-family="Georgia,serif" font-size="38" font-weight="bold" fill="#A9252B">a point of view.</text><text x="24" y="188" font-family="Arial,sans-serif" font-size="14" fill="#202020">Your work, told through selected stories.</text><rect x="24" y="232" width="200" height="69" fill="#A9252B"/><text x="38" y="273" font-family="Georgia,serif" font-size="20" fill="#FFFAF0">Featured story</text><text x="248" y="255" font-family="Arial,sans-serif" font-size="14" fill="#202020">More highlights</text><path d="M248 272H450 M248 285H427" stroke="#202020" opacity=".35"/></g><g transform="translate(50,510)"><rect width="480" height="345" rx="12" fill="#FFFDF7"/><text x="24" y="35" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#203BB5">03 / Color Studio</text><rect x="323" y="63" width="133" height="139" rx="5" fill="#F28F79"/><circle cx="389" cy="132" r="37" fill="#203BB5"/><text x="24" y="108" font-family="Arial,sans-serif" font-size="36" font-weight="900" fill="#203BB5">Make room</text><text x="24" y="150" font-family="Arial,sans-serif" font-size="36" font-weight="900" fill="#203BB5">for ideas.</text><text x="24" y="187" font-family="Arial,sans-serif" font-size="14" fill="#202020">Bright, direct, and full of personality.</text><rect x="24" y="229" width="252" height="73" rx="5" fill="#203BB5"/><rect x="290" y="229" width="166" height="73" rx="5" fill="#F28F79"/><text x="40" y="273" font-family="Arial,sans-serif" font-size="18" fill="white">Selected work →</text><text x="306" y="273" font-family="Arial,sans-serif" font-size="17" fill="#202020">Say hello →</text></g><g transform="translate(570,510)"><rect width="480" height="345" rx="12" fill="#18232E"/><text x="24" y="35" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#B9E8C8">04 / Retro Desktop</text><rect x="24" y="61" width="432" height="242" fill="#18232E" stroke="#B9E8C8" stroke-width="2"/><rect x="24" y="61" width="432" height="29" fill="#B9E8C8"/><text x="36" y="80" font-family="monospace" font-size="12" fill="#18232E">portfolio / welcome</text><text x="42" y="119" font-family="monospace" font-size="12" fill="#B9E8C8">ABOUT   WORK   EXPERIENCE   CONTACT</text><text x="42" y="170" font-family="monospace" font-size="29" fill="#F4F1E9">Hello, explorer.</text><text x="42" y="203" font-family="Arial,sans-serif" font-size="14" fill="#F4F1E9">A window into the work that matters.</text><path d="M42 233H437" stroke="#B9E8C8" opacity=".4"/><text x="42" y="269" font-family="monospace" font-size="14" fill="#B9E8C8">[ Open selected work → ]</text></g><text x="50" y="897" font-family="Arial,sans-serif" font-size="15" fill="#444">No portrait or project images required. Your approved content supplies the substance.</text></svg>